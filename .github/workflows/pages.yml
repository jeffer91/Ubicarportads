name: Publicar Ubicarportads en GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Verificar sintaxis JavaScript y motor local
        run: |
          node --check web/js/pdf-engine.js
          node --check web/js/app.js
          node --test web/tests/*.test.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
